[package]
name = "iclaw-canister"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ICP canister interface and build entrypoint for iclaw."
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
candid = "0.10.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ic-asset-certification = "3.1.0"
ic-cdk = "0.19.0"
ic-cdk-timers = "1.0.0"
ic-http-certification = "3.1.0"
parking_lot = "0.12"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
iclaw-core = { path = "../core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
canhttp = "0.5.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
http = "1.4"
ic-rusqlite = { path = "../vendor_ic_rusqlite", default-features = false, features = ["precompiled"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
canhttp = "0.5.2"
http = "1.4"
tokio = { version = "1.42", default-features = false, features = ["macros", "rt"] }
